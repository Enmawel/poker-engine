<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin - Mesas</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background:#0f1117;
      color:#e4e4e7;
      padding:2rem;
    }
    h1 { color:#22c55e; margin-bottom:0.5rem; }
    .subtitulo { color:#71717a; margin-bottom:2rem; }
    .crear-mesa {
      background:#1a1d27;
      border:1px solid #2a2d3a;
      border-radius:12px;
      padding:1.5rem;
      margin-bottom:2rem;
    }
    .crear-mesa h2 { font-size:1.1rem; margin-bottom:1rem; }
    .crear-mesa .fila { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; align-items: flex-end; }
    .crear-mesa input {
      background:#0f1117;
      border:1px solid #2a2d3a;
      color:#e4e4e7;
      padding:0.5rem 0.8rem;
      border-radius:8px;
      font-size:14px;
      width:160px;
    }
     .crear-mesa .campo {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .crear-mesa .campo label {
      font-size: 12px;
      color: #a1a1aa;
    }
    .crear-mesa button {
      background:#2d6a4f;
      border:1px solid #52b788;
      color:white;
      font-weight:bold;
      padding:0.5rem 1.2rem;
      border-radius:8px;
      cursor:pointer;
    }
    table {
      width:100%;
      border-collapse:collapse;
      background:#1a1d27;
      border-radius:12px;
      overflow:hidden;
    }
    th, td {
      padding:0.8rem 1rem;
      text-align:left;
      border-bottom:1px solid #2a2d3a;
    }
    th {
      background:#22272f;
      color:#a1a1aa;
      font-size:0.85rem;
      text-transform:uppercase;
    }
    .badge {
      padding:0.2rem 0.6rem;
      border-radius:6px;
      font-size:0.85rem;
    }
    .badge.esperando { background:#f59e0b22; color:#f59e0b; }
    .badge.jugando { background:#22c55e22; color:#22c55e; }
  </style>
</head>
<body>

  <h1>🃏 Admin — Mesas</h1>
  <p class="subtitulo">Crear y supervisar mesas (herramienta interna, no para jugadores)</p>

  <div class="crear-mesa">
    <h2>Crear mesa nueva</h2>
        <div class="fila">
      <div class="campo">
        <label for="inputAsientos">Asientos</label>
        <input type="number" id="inputAsientos" value="9">
      </div>
      <div class="campo">
        <label for="inputCiega">Ciega grande</label>
        <input type="number" id="inputCiega" value="50">
      </div>
      <div class="campo">
        <label for="inputFichas">Fichas iniciales</label>
        <input type="number" id="inputFichas" value="1000">
      </div>
      <div class="campo">
        <label for="inputBots">Bots</label>
        <input type="number" id="inputBots" value="8">
      </div>
      <div class="campo">
        <label for="inputMoneda">Moneda</label>
        <select id="inputMoneda">
          <option value="USD">USD ($)</option>
          <option value="VES">VES (Bs.)</option>
        </select>
      </div>
      <button onclick="crearMesa()">Crear mesa</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Mesa</th>
        <th>Estado</th>
        <th>Jugadores</th>
        <th>Ciega grande</th>
        <th>Moneda</th>
        <th></th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tablaMesas"></tbody>
  </table>

  <script>
    const ES_LOCAL = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost');
    const API_URL = ES_LOCAL
      ? 'http://localhost:3000'
      : 'https://poker-engine-production-0995.up.railway.app';
    const API_KEY = 'pk_facilitobet_x7k2m9q3';

      async function crearMesa() {
      const asientosMax = Number(document.getElementById('inputAsientos').value) || 2;
      const apuestaMinima = Number(document.getElementById('inputCiega').value) || 50;
      const fichasIniciales = Number(document.getElementById('inputFichas').value) || 1000;
      const bots = Number(document.getElementById('inputBots').value) || 0;
      const moneda = document.getElementById('inputMoneda').value;

      try {
        await fetch(`${API_URL}/mesa/crear`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': API_KEY
          },
          body: JSON.stringify({ asientosMax, apuestaMinima, fichasIniciales, bots, moneda })
        });
        cargarMesas();
      } catch (error) {
        console.error('Error creando mesa:', error);
      }
    }

        async function cargarMesas() {
      try {
        const respuesta = await fetch(`${API_URL}/mesas`, {
          headers: { 'x-api-key': API_KEY }
        });
        const datos = await respuesta.json();

        const tabla = document.getElementById('tablaMesas');
        tabla.innerHTML = '';

        const selectMesas = document.getElementById('selectMesaJugadores');
        const valorPrevio = selectMesas.value;
        selectMesas.innerHTML = '<option value="">-- elige una mesa --</option>';

        datos.mesas.forEach(mesa => {
          const simbolo = mesa.moneda === 'VES' ? 'Bs.' : '$';
          const fila = document.createElement('tr');
          const botonIniciar = mesa.estado === 'esperando'
            ? `<button onclick="iniciarMesa('${mesa.id}')">Iniciar ahora</button>`
            : '';
        fila.innerHTML = `
            <td>${mesa.id}</td>
            <td><span class="badge ${mesa.estado}">${mesa.estado}</span></td>
            <td>${mesa.asientosOcupados} / ${mesa.asientosMax}</td>
            <td>${simbolo} ${mesa.apuestaMinima}</td>
            <td>${mesa.moneda || 'USD'}</td>
            <td>${botonIniciar}</td>
            <td><button onclick="borrarMesa('${mesa.id}')">Borrar</button></td>
          `;
          tabla.appendChild(fila);

          const opcion = document.createElement('option');
          opcion.value = mesa.id;
          opcion.textContent = `${mesa.id} (${mesa.estado}, ${mesa.asientosOcupados}/${mesa.asientosMax})`;
          selectMesas.appendChild(opcion);
        });

        selectMesas.value = valorPrevio;
      } catch (error) {
        console.error('Error cargando mesas:', error);
      }
    }

        async function cargarJugadoresMesa() {
      const mesaId = document.getElementById('selectMesaJugadores').value;
      if (!mesaId) return;

      try {
        const respuesta = await fetch(`${API_URL}/admin/mesa/${mesaId}/jugadores`, {
          headers: { 'x-api-key': API_KEY }
        });
        const datos = await respuesta.json();

        const tabla = document.getElementById('tablaJugadoresMesa');
        tabla.innerHTML = '';

        datos.jugadores.forEach(jugador => {
          const fila = document.createElement('tr');
          fila.innerHTML = `
            <td>${jugador.nombre || ('Jugador ' + jugador.id)}${jugador.esBot ? ' (bot)' : ''}</td>
            <td>${jugador.fichas}</td>
            <td><input type="number" id="fichas-${jugador.id}" value="${jugador.fichas}" style="width:100px;"></td>
            <td><button onclick="guardarFichasJugador('${mesaId}', ${jugador.id})">Guardar</button></td>
          `;
          tabla.appendChild(fila);
        });
      } catch (error) {
        console.error('Error cargando jugadores:', error);
      }
    }

        async function iniciarMesa(id) {
      if (!confirm('¿Arrancar esta mesa ahora, aunque no esté llena?')) return;
      try {
        await fetch(`${API_URL}/mesa/${id}/iniciar`, {
          method: 'POST',
          headers: { 'x-api-key': API_KEY }
        });
        cargarMesas();
      } catch (error) {
        console.error('Error iniciando mesa:', error);
      }
    }

        async function borrarMesa(id) {
      if (!confirm('¿Seguro que quieres borrar esta mesa? Esto no se puede deshacer.')) return;
      try {
        await fetch(`${API_URL}/admin/mesa/${id}/eliminar`, {
          method: 'POST',
          headers: { 'x-api-key': API_KEY }
        });
        cargarMesas();
      } catch (error) {
        console.error('Error borrando mesa:', error);
      }
    }

    async function guardarFichasJugador(mesaId, jugadorId) {
      const nuevoMonto = Number(document.getElementById(`fichas-${jugadorId}`).value);
      try {
        await fetch(`${API_URL}/admin/mesa/${mesaId}/jugador/${jugadorId}/fichas`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': API_KEY
          },
          body: JSON.stringify({ fichas: nuevoMonto })
        });
        cargarJugadoresMesa();
      } catch (error) {
        console.error('Error actualizando fichas:', error);
      }
    }

    cargarMesas();
    setInterval(cargarMesas, 3000);
  </script>

    <div class="crear-mesa" style="margin-top:2rem;">
    <h2>Ajustar fichas de jugadores</h2>
    <div class="fila">
      <select id="selectMesaJugadores"></select>
      <button onclick="cargarJugadoresMesa()">Cargar jugadores</button>
    </div>
    <table style="margin-top:1rem;">
      <thead>
        <tr>
          <th>Jugador</th>
          <th>Fichas actuales</th>
          <th>Nuevo monto</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tablaJugadoresMesa"></tbody>
    </table>
  </div>

</body>
</html>
