<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lobby - Poker Engine</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background:#0f1117;
      color:#e4e4e7;
      padding:2rem;
    }
    h1 { color:#22c55e; margin-bottom:0.5rem; }
    .subtitulo { color:#71717a; margin-bottom:2rem; }
    .usuario-box {
      background:#1a1d27;
      border:1px solid #2a2d3a;
      border-radius:12px;
      padding:1rem 1.5rem;
      margin-bottom:2rem;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .usuario-box input {
      background:#0f1117;
      border:1px solid #2a2d3a;
      color:#e4e4e7;
      padding:0.5rem 0.8rem;
      border-radius:8px;
      font-size:14px;
    }
    .crear-mesa {
      background:#1a1d27;
      border:1px solid #2a2d3a;
      border-radius:12px;
      padding:1.5rem;
      margin-bottom:2rem;
    }
    .crear-mesa h2 { font-size:1.1rem; margin-bottom:1rem; }
    .crear-mesa .fila { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
    .crear-mesa input {
      background:#0f1117;
      border:1px solid #2a2d3a;
      color:#e4e4e7;
      padding:0.5rem 0.8rem;
      border-radius:8px;
      font-size:14px;
      width:160px;
    }
    .crear-mesa button {
      background:#2d6a4f;
      border:1px solid #52b788;
      color:white;
      font-weight:bold;
      padding:0.5rem 1.2rem;
      border-radius:8px;
      cursor:pointer;
    }
    table {
      width:100%;
      border-collapse:collapse;
      background:#1a1d27;
      border-radius:12px;
      overflow:hidden;
    }
    th, td {
      padding:0.8rem 1rem;
      text-align:left;
      border-bottom:1px solid #2a2d3a;
    }
    th {
      background:#22272f;
      color:#a1a1aa;
      font-size:0.85rem;
      text-transform:uppercase;
    }
    .badge {
      padding:0.2rem 0.6rem;
      border-radius:6px;
      font-size:0.85rem;
    }
    .badge.esperando { background:#f59e0b22; color:#f59e0b; }
    .badge.jugando { background:#22c55e22; color:#22c55e; }
    .btn-unirse {
      background:#2d6a4f;
      border:1px solid #52b788;
      color:white;
      padding:0.4rem 1rem;
      border-radius:8px;
      cursor:pointer;
      font-size:13px;
    }
    .btn-unirse:disabled {
      background:#2a2d3a;
      border-color:#3a3d4a;
      color:#71717a;
      cursor:not-allowed;
    }

    .tabla-scroll {
      overflow-x: auto;
    }

    @media (max-width: 500px) {
      body {
        padding: 1rem;
      }
      .crear-mesa input {
        width: 47%;
      }
      table {
        min-width: 480px;
      }
    }
    .nombres-mesa {
      font-size: 11px;
      color: #71717a;
      margin-top: 2px;
    }

    .error-mensaje {
      background: #7f1d1d33;
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 0.8rem 1.2rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      font-size: 14px;
    }
    .error-mensaje.oculto {
      display: none;
    }
    .logo-plataforma {
      max-width: 320px;
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 0.5rem;
    }

  </style>
</head>
<body>

  <img src="imagenes/logo-facilitobet.png" alt="Logo" class="logo-plataforma" id="logoPlataforma">
  <p class="subtitulo">Elige una mesa para unirte</p>

  <div class="usuario-box">
    <label for="nombreUsuario">Tu nombre:</label>
    <input type="text" id="nombreUsuario" placeholder="Ej: Carlos">
  </div>

  <div class="error-mensaje oculto" id="errorMensaje">
    No se pudo cargar la lista de mesas. Verifica tu conexión o que el servidor esté encendido.
  </div>

  <div class="tabla-scroll">
  <table>
    <thead>
      <tr>
        <th>Mesa</th>
        <th>Estado</th>
        <th>Jugadores</th>
        <th>Ciega grande</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tablaMesas"></tbody>
  </table>
  </div>

  <script>
    const ES_LOCAL = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost');
    const API_URL = ES_LOCAL
      ? 'http://localhost:3000'
      : 'https://poker-engine-production-0995.up.railway.app';
    const API_KEY = 'pk_facilitobet_x7k2m9q3';

    const params = new URLSearchParams(window.location.search);
    const nombreDesdeUrl = params.get('usuario') || '';
    document.getElementById('nombreUsuario').value = nombreDesdeUrl;

    async function unirseAMesa(idMesa) {
      const nombre = document.getElementById('nombreUsuario').value.trim();
      if (!nombre) {
        alert('Escribe tu nombre antes de unirte a una mesa');
        return;
      }

      try {
        const respuesta = await fetch(`${API_URL}/mesa/${idMesa}/unirse`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': API_KEY
          },
          body: JSON.stringify({ nombreUsuario: nombre })
        });
        const datos = await respuesta.json();

        if (!respuesta.ok) {
          alert(datos.error || 'No se pudo unir a la mesa');
          return;
        }

        window.location.href = `mesa.html?mesaId=${idMesa}&jugadorId=${datos.jugadorId}&token=${datos.token}`;
      } catch (error) {
        console.error('Error uniéndose a la mesa:', error);
      }
    }

    async function cargarPlataforma() {
      try {
        const respuesta = await fetch(`${API_URL}/plataforma`, {
          headers: { 'x-api-key': API_KEY }
        });
        const datos = await respuesta.json();
        document.title = `Lobby - ${datos.nombre}`;
      } catch (error) {
        console.error('Error cargando nombre de la plataforma:', error);
      }
    }

    cargarPlataforma();

    async function cargarMesas() {
      const errorMensaje = document.getElementById('errorMensaje');
      try {
        const respuesta = await fetch(`${API_URL}/mesas`, {
          headers: { 'x-api-key': API_KEY }
        });

        if (!respuesta.ok) {
          throw new Error(`Respuesta no válida: ${respuesta.status}`);
        }

        const datos = await respuesta.json();
        errorMensaje.classList.add('oculto');

        const tabla = document.getElementById('tablaMesas');
        tabla.innerHTML = '';
        datos.mesas.forEach(mesa => {
          const fila = document.createElement('tr');
          const llena = mesa.asientosOcupados >= mesa.asientosMax;
          const puedeUnirse = mesa.estado === 'esperando' && !llena;
          const nombres = (mesa.nombresJugadores && mesa.nombresJugadores.length > 0)
            ? mesa.nombresJugadores.join(', ')
            : '—';

          fila.innerHTML = `
            <td>${mesa.id}</td>
            <td><span class="badge ${mesa.estado}">${mesa.estado}</span></td>
            <td>
              ${mesa.asientosOcupados} / ${mesa.asientosMax}
              <div class="nombres-mesa">${nombres}</div>
            </td>
            <td>${mesa.moneda === 'VES' ? 'Bs.' : '$'} ${mesa.apuestaMinima}</td>
            <td><button class="btn-unirse" ${puedeUnirse ? '' : 'disabled'} onclick="unirseAMesa('${mesa.id}')">Unirse</button></td>
          `;
          tabla.appendChild(fila);
        });
      } catch (error) {
        console.error('Error cargando mesas:', error);
        errorMensaje.classList.remove('oculto');
      }
    }
    cargarMesas();
    setInterval(cargarMesas, 15000);

    const scriptSocket = document.createElement('script');
    scriptSocket.src = `${API_URL}/socket.io/socket.io.js`;
    scriptSocket.onload = () => {
      const socket = io(API_URL);
      socket.on('mesasActualizadas', cargarMesas);
    };
    document.head.appendChild(scriptSocket);
  </script>

</body>
</html>
